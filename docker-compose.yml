services:
  phoenix:
    build:
      dockerfile: ./Dockerfile
      context: .
    depends_on:
      - db
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >
          import urllib.request, sys;
          urllib.request.urlopen("http://localhost:6006/healthz")
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    ports:
      - 6006:6006
      - 4317:4317
    env_file:
      - .env
    environment:
      - PHOENIX_SQL_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - PHOENIX_ENABLE_AUTH=${PHOENIX_ENABLE_AUTH}
      - PHOENIX_SECRET=${PHOENIX_SECRET}
  eval-runner:
    build:
      dockerfile: ./Dockerfile
      context: .
    depends_on:
      phoenix:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PHOENIX_PROJECT=${PHOENIX_PROJECT}
      - EVAL_WINDOW_MINUTES=${EVAL_WINDOW_MINUTES}
      - EVAL_INTERVAL_SECONDS=${EVAL_INTERVAL_SECONDS}
      - EVAL_MODEL=${EVAL_MODEL}
      - EVAL_SKIP_QA=${EVAL_SKIP_QA}
      - EVAL_EXPLAIN=${EVAL_EXPLAIN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PHOENIX_API_KEY=${PHOENIX_API_KEY}
      - PHOENIX_COLLECTOR_ENDPOINT=${PHOENIX_COLLECTOR_ENDPOINT}
    command:
      - -m
      - scripts.evals.run_dify_rag_evals
      - --loop
  experiment-runner:
    build:
      dockerfile: ./Dockerfile
      context: .
    depends_on:
      phoenix:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DIFY_BASE_URL=${DIFY_BASE_URL}
      - DIFY_API_KEY=${DIFY_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PHOENIX_BASE_URL=http://phoenix:6006
      - EVAL_MODEL=${EVAL_MODEL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - manual
    command:
      - -m
      - scripts.experiments.run_dify_experiment
      - --help
  db:
    image: postgres:16
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5432
    volumes:
      - database_data:/var/lib/postgresql/data
volumes:
  database_data:
    driver: local
